[project]
name = "mock-agent-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jsonschema>=4.26.0",
    "pydantic>=2",
    "sentry-sdk>=2.67.1",
    "uvicorn[standard]>=0.52.1",
    "voice-contract",
]

[project.scripts]
mock-agent-backend = "mock_agent_backend:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
voice-contract = { path = "../../libs/voice-contract", editable = true }
